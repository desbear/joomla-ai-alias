PLG_SYSTEM_AIALIAS="System - AI Alias"
PLG_SYSTEM_AIALIAS_XML_DESCRIPTION="Generates SEO-optimised article aliases with an OpenAI-compatible API: an AI button in the article editor, and automatic aliases for articles saved without one (API, MCP, importers). Falls back to Joomla's own conversion when the API is unavailable or out of credits."
PLG_SYSTEM_AIALIAS_API_KEY="API Key"
PLG_SYSTEM_AIALIAS_API_KEY_DESC="OpenAI API key (sk-...), up to 500 characters. The field is locked: press Modify to replace it. Saving without unlocking keeps the stored key."
PLG_SYSTEM_AIALIAS_API_BASE="API Base URL"
PLG_SYSTEM_AIALIAS_API_BASE_DESC="Any OpenAI-compatible endpoint. /chat/completions is appended."
PLG_SYSTEM_AIALIAS_MODEL="Model"
PLG_SYSTEM_AIALIAS_MODEL_DESC="For example gpt-4.1-mini or gpt-4.1-nano. A small model is enough for slugs."
PLG_SYSTEM_AIALIAS_TIMEOUT="Timeout (seconds)"
PLG_SYSTEM_AIALIAS_MAX_LENGTH="Maximum alias length"
PLG_SYSTEM_AIALIAS_EXTRA_PROMPT="Extra instructions"
PLG_SYSTEM_AIALIAS_EXTRA_PROMPT_DESC="Site-specific guidance added to the prompt, e.g. product names and preferred keywords."
PLG_SYSTEM_AIALIAS_FIELDSET_AUTOMATION="Automation & Fallback"
PLG_SYSTEM_AIALIAS_AUTO_MODE="Automatic aliases"
PLG_SYSTEM_AIALIAS_AUTO_MODE_DESC="On save, when the alias is empty or still non-ASCII, generate it with AI instead of Joomla's PHP transliteration. The PHP conversion is only used when the AI fails or is out of credits."
PLG_SYSTEM_AIALIAS_AUTO_MODE_OFF="Off (button only)"
PLG_SYSTEM_AIALIAS_AUTO_MODE_NONFORM="Only articles created without the edit form (API, MCP, importers); the edit form keeps the PHP transliteration"
PLG_SYSTEM_AIALIAS_AUTO_MODE_ALL="All articles, including the edit form (default, replaces the PHP transliteration)"
PLG_SYSTEM_AIALIAS_FALLBACK="Fallback conversion"
PLG_SYSTEM_AIALIAS_FALLBACK_DESC="Used when the API is out of credits or fails. Joomla: the core transliteration for the site language (Chinese becomes pinyin here; the date if nothing is left). Unicode: keeps Chinese characters in the alias."
PLG_SYSTEM_AIALIAS_FALLBACK_JOOMLA="Joomla core (site setting)"
PLG_SYSTEM_AIALIAS_FALLBACK_UNICODE="Unicode slug"
PLG_SYSTEM_AIALIAS_FALLBACK_ON_ERROR="Fallback on other errors"
PLG_SYSTEM_AIALIAS_FALLBACK_ON_ERROR_DESC="Out-of-credit always falls back. When No, other errors (bad key, timeout) are shown to the editor, and automatic saves keep Joomla's alias."
PLG_SYSTEM_AIALIAS_QUOTA_COOLDOWN="Credit cooldown (minutes)"
PLG_SYSTEM_AIALIAS_QUOTA_COOLDOWN_DESC="After an out-of-credit response, skip the API for this long so saves are not slowed down. 0 = always try."
PLG_SYSTEM_AIALIAS_LOG="Log"
PLG_SYSTEM_AIALIAS_LOG_DESC="Write generated aliases and fallbacks to administrator/logs/plg_system_aialias.php."
PLG_SYSTEM_AIALIAS_JS_BUTTON="AI alias"
PLG_SYSTEM_AIALIAS_JS_WORKING="Generating..."
PLG_SYSTEM_AIALIAS_JS_CONFIRM_OVERWRITE="Replace the current alias with an AI-generated one?"
PLG_SYSTEM_AIALIAS_JS_NEED_TITLE="Please enter a title first."
PLG_SYSTEM_AIALIAS_JS_DONE_AI="SEO alias generated by AI."
PLG_SYSTEM_AIALIAS_JS_DONE_FALLBACK="AI unavailable (%s); alias generated by the fallback conversion."
PLG_SYSTEM_AIALIAS_JS_ERROR="Could not generate the alias."
PLG_SYSTEM_AIALIAS_ERR_NO_KEY="API key not set"
PLG_SYSTEM_AIALIAS_ERR_BAD_KEY="invalid API key (401), key ends with %s"
PLG_SYSTEM_AIALIAS_ERR_QUOTA="API credits exhausted"
PLG_SYSTEM_AIALIAS_ERR_QUOTA_COOLDOWN="API credits exhausted, waiting for cooldown"
PLG_SYSTEM_AIALIAS_ERR_REQUEST="connection failed: %s"
PLG_SYSTEM_AIALIAS_ERR_API="API error %s: %s"
PLG_SYSTEM_AIALIAS_ERR_EMPTY="empty AI response"
PLG_SYSTEM_AIALIAS_FIELDSET_INTEGRATION="Components"
PLG_SYSTEM_AIALIAS_COM_CONTENT="Joomla articles"
PLG_SYSTEM_AIALIAS_COM_CONTENT_DESC="Button and automatic aliases for com_content articles."
PLG_SYSTEM_AIALIAS_COM_FLEXICONTENT="FLEXIcontent items"
PLG_SYSTEM_AIALIAS_COM_FLEXICONTENT_DESC="Button and automatic aliases for FLEXIcontent item editing."
PLG_SYSTEM_AIALIAS_CONTENT_IDS="Text field IDs"
PLG_SYSTEM_AIALIAS_CONTENT_IDS_DESC="Comma separated editor field IDs read for the article text, tried in order. FLEXIcontent text fields are usually jform_text or jform_fieldname."
PLG_SYSTEM_AIALIAS_RATE_LIMIT="Calls per minute"
PLG_SYSTEM_AIALIAS_RATE_LIMIT_DESC="Site-wide ceiling on AI calls per minute, so an author or a bulk import cannot spend the whole budget. Saves above the limit use the fallback conversion. 0 = no limit."
PLG_SYSTEM_AIALIAS_ERR_RATE="rate limit reached"
