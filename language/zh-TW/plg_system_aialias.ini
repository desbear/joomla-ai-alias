PLG_SYSTEM_AIALIAS="系統 - AI 別名產生器"
PLG_SYSTEM_AIALIAS_XML_DESCRIPTION="透過 OpenAI 相容 API 產生 SEO 優化的文章別名：文章編輯畫面提供「AI 產生別名」按鈕，並可在 API、MCP、匯入工具等非人工建立文章時自動套用。API 點數不足或無法連線時，自動改用 Joomla 內建的 PHP 轉換。"
PLG_SYSTEM_AIALIAS_API_KEY="API 金鑰"
PLG_SYSTEM_AIALIAS_API_KEY_DESC="OpenAI API 金鑰（sk-...），最長 500 字元。欄位已鎖定，要更換請先按「修改」；不按修改直接存檔不會動到既有金鑰。"
PLG_SYSTEM_AIALIAS_API_BASE="API 網址"
PLG_SYSTEM_AIALIAS_API_BASE_DESC="任何 OpenAI 相容端點，程式會自動加上 /chat/completions。"
PLG_SYSTEM_AIALIAS_MODEL="模型"
PLG_SYSTEM_AIALIAS_MODEL_DESC="例如 gpt-4.1-mini 或 gpt-4.1-nano，產生別名用小模型即可。"
PLG_SYSTEM_AIALIAS_TIMEOUT="逾時（秒）"
PLG_SYSTEM_AIALIAS_MAX_LENGTH="別名最大長度"
PLG_SYSTEM_AIALIAS_EXTRA_PROMPT="額外提示詞"
PLG_SYSTEM_AIALIAS_EXTRA_PROMPT_DESC="加在提示詞後的站台專屬指引，例如產品名稱的英文寫法、偏好的關鍵字。"
PLG_SYSTEM_AIALIAS_FIELDSET_AUTOMATION="自動化與備援"
PLG_SYSTEM_AIALIAS_AUTO_MODE="自動產生別名"
PLG_SYSTEM_AIALIAS_AUTO_MODE_DESC="儲存文章時，若別名空白或仍是中文，先用 AI 產生 SEO 別名，取代 Joomla 預設的 PHP 拼音轉換；AI 失敗或點數不足才退回 PHP 轉換。"
PLG_SYSTEM_AIALIAS_AUTO_MODE_OFF="關閉（只用按鈕）"
PLG_SYSTEM_AIALIAS_AUTO_MODE_NONFORM="僅非人工建立的文章（API、MCP、匯入工具）；人工編輯仍用 PHP 拼音"
PLG_SYSTEM_AIALIAS_AUTO_MODE_ALL="全部文章，含人工編輯（預設，取代 PHP 拼音）"
PLG_SYSTEM_AIALIAS_FALLBACK="備援轉換方式"
PLG_SYSTEM_AIALIAS_FALLBACK_DESC="API 點數不足或失敗時使用。Joomla 內建：依站台語言轉換（本站中文會轉成拼音，如 ru-he-she-ding-you-jian-tong-zhi）。Unicode：別名保留中文字。"
PLG_SYSTEM_AIALIAS_FALLBACK_JOOMLA="Joomla 內建（依站台設定）"
PLG_SYSTEM_AIALIAS_FALLBACK_UNICODE="Unicode 別名（保留中文）"
PLG_SYSTEM_AIALIAS_FALLBACK_ON_ERROR="其他錯誤也改用備援"
PLG_SYSTEM_AIALIAS_FALLBACK_ON_ERROR_DESC="點數不足一律改用備援。設為「否」時，其他錯誤（金鑰錯誤、逾時）會顯示給編輯者，自動儲存則保留 Joomla 產生的別名。"
PLG_SYSTEM_AIALIAS_QUOTA_COOLDOWN="點數不足冷卻時間（分鐘）"
PLG_SYSTEM_AIALIAS_QUOTA_COOLDOWN_DESC="收到點數不足回應後，這段時間內直接走備援、不再呼叫 API，避免拖慢儲存。0 = 每次都嘗試。"
PLG_SYSTEM_AIALIAS_LOG="記錄日誌"
PLG_SYSTEM_AIALIAS_LOG_DESC="將產生的別名與備援原因寫入 administrator/logs/plg_system_aialias.php。"
PLG_SYSTEM_AIALIAS_JS_BUTTON="AI 產生別名"
PLG_SYSTEM_AIALIAS_JS_WORKING="產生中..."
PLG_SYSTEM_AIALIAS_JS_CONFIRM_OVERWRITE="要用 AI 產生的別名取代目前的別名嗎？"
PLG_SYSTEM_AIALIAS_JS_NEED_TITLE="請先輸入標題。"
PLG_SYSTEM_AIALIAS_JS_DONE_AI="已由 AI 產生 SEO 別名。"
PLG_SYSTEM_AIALIAS_JS_DONE_FALLBACK="AI 無法使用（%s），已改用 PHP 備援轉換產生別名。"
PLG_SYSTEM_AIALIAS_JS_ERROR="無法產生別名。"
PLG_SYSTEM_AIALIAS_ERR_NO_KEY="尚未設定 API 金鑰"
PLG_SYSTEM_AIALIAS_ERR_BAD_KEY="API 金鑰無效 (401)，金鑰末四碼 %s"
PLG_SYSTEM_AIALIAS_ERR_QUOTA="API 點數不足"
PLG_SYSTEM_AIALIAS_ERR_QUOTA_COOLDOWN="API 點數不足，冷卻中"
PLG_SYSTEM_AIALIAS_ERR_REQUEST="連線失敗：%s"
PLG_SYSTEM_AIALIAS_ERR_API="API 錯誤 %s：%s"
PLG_SYSTEM_AIALIAS_ERR_EMPTY="AI 未回傳結果"
PLG_SYSTEM_AIALIAS_FIELDSET_INTEGRATION="套用元件"
PLG_SYSTEM_AIALIAS_COM_CONTENT="Joomla 文章"
PLG_SYSTEM_AIALIAS_COM_CONTENT_DESC="在 com_content 文章套用按鈕與自動別名。"
PLG_SYSTEM_AIALIAS_COM_FLEXICONTENT="FLEXIcontent 項目"
PLG_SYSTEM_AIALIAS_COM_FLEXICONTENT_DESC="在 FLEXIcontent 項目編輯畫面套用按鈕與自動別名。"
PLG_SYSTEM_AIALIAS_CONTENT_IDS="內文欄位 ID"
PLG_SYSTEM_AIALIAS_CONTENT_IDS_DESC="以逗號分隔的編輯器欄位 ID，依序尋找文章內文。FLEXIcontent 的內文欄位通常是 jform_text 或 jform_欄位名稱。"
PLG_SYSTEM_AIALIAS_RATE_LIMIT="每分鐘呼叫上限"
PLG_SYSTEM_AIALIAS_RATE_LIMIT_DESC="全站每分鐘最多呼叫 AI 幾次，避免單一作者或大量匯入把點數用光。超過上限的儲存會改用備援轉換。0 = 不限制。"
PLG_SYSTEM_AIALIAS_ERR_RATE="已達每分鐘呼叫上限"
